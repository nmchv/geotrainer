<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Глобус — Геотренажёр</title>
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  :root {
    --bg: #050816; --surface: #0e121b; --elev: #171c27; --border: #2a303c;
    --text: #f2f4f7; --mute: #9aa3b2; --acc: #5b8def; --acc-h: #a5c4ff;
    --ok: #3bc48a; --bad: #ef5b64; --warn: #e5a921;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Manrope Variable', Manrope, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- верхняя панель ---------- */
  .top { position: relative; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: rgb(14 18 27 / .92); border-bottom: 1px solid var(--border); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .top a.back { color: var(--mute); text-decoration: none; font-size: .9rem; white-space: nowrap; }
  .top a.back:hover { color: var(--acc-h); }
  #task { flex: 1; min-width: 190px; font-weight: 700; font-size: 1.05rem; line-height: 1.3; }
  #task span { color: var(--acc-h); }
  #task small { display: block; font-weight: 400; color: var(--mute); font-size: .8rem; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; border: 0; color: var(--mute); padding: 8px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
  .seg button.on { background: var(--elev); color: var(--acc-h); }
  select, .btn { font: inherit; font-size: .85rem; color: var(--text); background: var(--elev);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  select { max-width: 230px; }
  .btn:hover, select:hover { border-color: var(--acc); }
  .btn.pri { background: var(--acc); border-color: var(--acc); color: #06080c; font-weight: 600; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--mute); cursor: pointer; white-space: nowrap; }
  label.chk input { accent-color: var(--acc); width: 16px; height: 16px; }
  #score { font-variant-numeric: tabular-nums; font-size: .85rem; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }

  /* ---------- сцена ---------- */
  #wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--bg); }
  #map { position: absolute; inset: 0; z-index: 1; background: transparent; }
  .maplibregl-canvas { outline: none; }

  /* ---------- космос ---------- */
  #space { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background: radial-gradient(ellipse at 50% 58%, #0b1535 0%, #060a1d 50%, #02030a 100%); transition: opacity .4s; }
  #space::before { content: ''; position: absolute; inset: -25%;
    background:
      radial-gradient(ellipse 62% 13% at 50% 50%, rgb(150 170 255 / .14), transparent 70%),
      radial-gradient(ellipse 38% 8% at 34% 47%, rgb(255 205 170 / .08), transparent 70%),
      radial-gradient(ellipse 30% 7% at 70% 54%, rgb(170 150 255 / .08), transparent 70%);
    transform: rotate(-27deg); filter: blur(12px); }
  #space.off { opacity: 0; }
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  .body { position: absolute; width: var(--s); height: var(--s);
    transform: translate(-50%, -50%) translate3d(var(--dx, 0px), var(--dy, 0px), 0); will-change: transform; }
  .body .in { position: absolute; inset: 0; animation: bob var(--t, 11s) ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(-4px); } to { transform: translateY(5px); } }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .sph { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
  .sph::after { content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 72% 30%, rgb(255 255 255 / .2) 0, transparent 36%, rgb(0 0 0 / .38) 68%, rgb(0 0 0 / .82) 100%); }
  .nm { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: .7vmin; font-size: .66rem;
    letter-spacing: .08em; color: rgb(255 255 255 / .4); white-space: nowrap; }

  .sun .cor { position: absolute; left: 50%; top: 50%; width: 74vmin; height: 74vmin; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle, rgb(255 205 110 / .30) 0, rgb(255 140 40 / .13) 28%, transparent 64%); }
  .sun .ray { position: absolute; left: 50%; top: 50%; width: 80vmin; height: 80vmin; transform: translate(-50%, -50%); border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgb(255 225 160 / .11) 0 3deg, transparent 3deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 8%, transparent 62%); mask-image: radial-gradient(circle, #000 8%, transparent 62%);
    animation: spin 160s linear infinite; }
  .sun .sph { background: radial-gradient(circle, #fffef2 0, #fff1a8 36%, #ffcc55 66%, #ff9822 100%);
    box-shadow: 0 0 5vmin 1.6vmin rgb(255 170 60 / .8), 0 0 18vmin 7vmin rgb(255 115 30 / .34); }
  .sun .sph::after { display: none; }
  .sun .nm { color: rgb(255 226 160 / .6); }

  .mercury .sph { background: radial-gradient(circle at 60% 40%, #c4beb4, #8b857b 60%, #5c574f); }
  .venus .sph   { background: radial-gradient(circle at 60% 40%, #fbe9b8, #dcb66f 58%, #a97c3c); }
  .mars .sph    { background: radial-gradient(circle at 24% 8%, rgb(255 255 255 / .9) 0, transparent 14%), radial-gradient(circle at 60% 40%, #ee9363, #c1502e 58%, #7b2a14); }
  .uranus .sph  { background: radial-gradient(circle at 60% 40%, #c6f3f5, #7fcdd5 58%, #4f9aa4); }
  .neptune .sph { background: radial-gradient(circle at 60% 40%, #7aa8ff, #3a63d6 58%, #1b2f86); }
  .jupiter .sph { background: linear-gradient(180deg, #b88a5c 0 7%, #e8d0a6 7% 15%, #a86f45 15% 25%, #efdcb9 25% 37%, #b98456 37% 45%, #dfc093 45% 57%, #a56a42 57% 67%, #ead4ad 67% 79%, #b88a5c 79% 100%); }
  .jupiter .sph::before { content: ''; position: absolute; left: 52%; top: 58%; width: 24%; height: 13%; border-radius: 50%;
    background: radial-gradient(ellipse, #d0613a, #a5421f 70%, transparent 100%); z-index: 1; }
  .saturn .sph  { background: linear-gradient(180deg, #cfae72 0 12%, #ecd9a6 12% 26%, #c9a468 26% 40%, #f2e2b5 40% 55%, #c19c60 55% 70%, #e8d29b 70% 85%, #b78f55 85% 100%); }
  .ring { position: absolute; left: -48%; top: 27%; width: 196%; height: 46%; border-radius: 50%; transform: rotate(-17deg);
    background: radial-gradient(ellipse at center, transparent 0 47%, rgb(222 198 150 / .85) 49% 61%, rgb(120 104 80 / .5) 62% 64%, rgb(200 178 134 / .7) 65% 73%, transparent 75%); }
  .ring.back { z-index: -1; }
  .ring.front { clip-path: inset(50% 0 0 0); z-index: 2; }

  @media (max-width: 700px) {
    .hide-s, .nm { display: none; }
    .sun { --s: 12vmin !important; }
  }
  @media (prefers-reduced-motion: reduce) { .body .in, .sun .ray { animation: none; } }

  /* ---------- поверх карты ---------- */
  #toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5;
    background: rgb(23 28 39 / .94); border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 16px; font-size: .9rem; opacity: 0; transition: opacity .15s; pointer-events: none; max-width: 92%; text-align: center; }
  #toast.on { opacity: 1; }
  #toast.ok { border-color: var(--ok); color: #6ef0b2; }
  #toast.bad { border-color: var(--bad); color: #ff8e95; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 8; background: var(--bg); color: var(--mute); padding: 20px; text-align: center; }
  .mark { width: 14px; height: 14px; border-radius: 50%; background: #ffd166; border: 2px solid #111; box-shadow: 0 0 0 2px rgb(255 209 102 / .35); cursor: pointer; }
  .cap-truth { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .cap-truth i { width: 14px; height: 14px; border-radius: 50%; background: #3bc48a; border: 2px solid #fff; box-shadow: 0 0 0 4px rgb(59 196 138 / .35); }
  .cap-truth b { margin-top: 4px; font-size: .78rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: rgb(8 12 24 / .85); border: 1px solid #3bc48a; white-space: nowrap; }
  .cap-user { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; pointer-events: none; }
  .cap-user.ok { background: #3bc48a; } .cap-user.bad { background: #ef5b64; }
  .maplibregl-ctrl-group { background: var(--elev); }
  .maplibregl-ctrl-group button + button { border-top-color: var(--border); }
  .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: invert(1) brightness(1.4); }

  #result { position: absolute; inset: 0; z-index: 9; display: none; place-items: center; background: rgb(2 4 12 / .72); padding: 16px; }
  #result.on { display: grid; }
  .card { width: min(420px, 100%); background: var(--elev); border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: 0 24px 72px rgb(0 0 0 / .55); }
  .card h2 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: -.02em; }
  .card p { margin: 6px 0; color: var(--mute); }
  .card .big { font-size: 2.6rem; font-weight: 700; color: var(--text); letter-spacing: -.03em; margin: 4px 0; }
  .card .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="top">
  <a class="back" href="index.html">← К тренажёру</a>
  <div id="task">Глобус<small>Вращайте, приближайте, нажимайте на страны</small></div>
  <span class="seg" id="modes">
    <button data-m="explore" class="on">Обзор</button>
    <button data-m="mark">Метки</button>
    <button data-m="quiz">Тест</button>
  </span>
  <select id="test" title="Выберите тест" style="display:none"></select>
  <label class="chk" id="capwrap" style="display:none"><input type="checkbox" id="capchk" checked> Столицы</label>
  <button class="btn" id="hintb" style="display:none">Подсказка</button>
  <button class="btn" id="skip" style="display:none">Пропустить</button>
  <button class="btn" id="stop" style="display:none">Завершить</button>
  <button class="btn" id="clear" style="display:none">Стереть метки</button>
  <span id="score" style="display:none"></span>
  <label class="chk" title="Звёзды, Солнце и планеты вокруг глобуса"><input type="checkbox" id="spacechk" checked> Космос</label>
</div>

<div id="wrap">
  <div id="space" aria-hidden="true">
    <canvas id="stars"></canvas>

    <div class="body sun" data-d=".25" style="left:86%;top:15%;--s:15vmin;--t:14s"><div class="in">
      <i class="cor"></i><i class="ray"></i><div class="sph"></div><span class="nm">Солнце</span></div></div>

    <div class="body mercury hide-s" data-d=".55" style="left:9%;top:80%;--s:2.3vmin;--t:8s"><div class="in"><div class="sph"></div><span class="nm">Меркурий</span></div></div>
    <div class="body venus" data-d=".45" style="left:17%;top:19%;--s:4.8vmin;--t:10s"><div class="in"><div class="sph"></div><span class="nm">Венера</span></div></div>
    <div class="body mars" data-d=".6" style="left:91%;top:72%;--s:4vmin;--t:9s"><div class="in"><div class="sph"></div><span class="nm">Марс</span></div></div>
    <div class="body jupiter" data-d=".35" style="left:6%;top:52%;--s:12vmin;--t:16s"><div class="in"><div class="sph"></div><span class="nm">Юпитер</span></div></div>
    <div class="body saturn" data-d=".3" style="left:78%;top:40%;--s:8.5vmin;--t:15s"><div class="in"><i class="ring back"></i><div class="sph"></div><i class="ring front"></i><span class="nm">Сатурн</span></div></div>
    <div class="body uranus hide-s" data-d=".5" style="left:31%;top:92%;--s:5.2vmin;--t:12s"><div class="in"><div class="sph"></div><span class="nm">Уран</span></div></div>
    <div class="body neptune" data-d=".5" style="left:66%;top:93%;--s:5vmin;--t:13s"><div class="in"><div class="sph"></div><span class="nm">Нептун</span></div></div>
  </div>

  <div id="map"></div>
  <div id="toast"></div>
  <div id="result"><div class="card" id="rescard"></div></div>
  <div id="loading">Загрузка глобуса…</div>
</div>

<script src="maplibre-gl.js"></script>
<script src="globe-data.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var D = window.GLOBE_DATA;
  if (!D) { $('loading').textContent = 'Не найден файл globe-data.js — положите его рядом с globe.html.'; return; }
  if (typeof maplibregl === 'undefined') { $('loading').textContent = 'Не найден файл maplibre-gl.js — положите maplibre-gl.js и maplibre-gl.css рядом с globe.html.'; return; }

  // ---------------------------------------------------------------- данные
  var WORLD_MAPS = { world: 1, europe: 1, asia: 1, africa: 1, namerica: 1, samerica: 1, oceania: 1 };
  var VIEW = {
    world:    { c: [37, 28],   z: 1.5 },
    europe:   { c: [14, 52],   z: 3.3 },
    asia:     { c: [88, 38],   z: 2.3 },
    africa:   { c: [20, 3],    z: 2.5 },
    namerica: { c: [-98, 42],  z: 2.2 },
    samerica: { c: [-60, -16], z: 2.5 },
    oceania:  { c: [150, -18], z: 2.7 }
  };
  // масштаб подстраиваем под размер экрана: на телефоне глобус не должен вылезать за края
  function viewOf(key) {
    var v = VIEW[key] || VIEW.world, w = $('wrap').clientWidth || 1000, h = $('wrap').clientHeight || 700;
    var wz = Math.log(0.72 * Math.min(w, h) * Math.PI / 512) / Math.LN2;
    return { c: v.c, z: Math.max(0.7, v.z + (wz - 1.5)) };
  }

  var kind = {}, nameOf = {}, dotK = {};          // kind: 'c' страна, 'r' река, 'd' точка
  D.countries.features.forEach(function (f) { kind[f.properties.id] = 'c'; nameOf[f.properties.id] = f.properties.name; });
  D.rivers.features.forEach(function (f) { kind[f.properties.id] = 'r'; nameOf[f.properties.id] = f.properties.name; });
  D.dots.features.forEach(function (f) { kind[f.properties.id] = 'd'; nameOf[f.properties.id] = f.properties.name; dotK[f.properties.id] = f.properties.k; });

  var tests = [], settings = {}, capName = {};

  // ---------------------------------------------------------------- карта
  function fail(msg) { var l = $('loading'); l.style.display = 'grid'; l.innerHTML = msg; }
  var map;
  try {
  map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      projection: { type: 'globe' },
      sources: {},
      layers: [{ id: 'sea', type: 'background', paint: { 'background-color': '#0b2342' } }]
    },
    center: viewOf('world').c,
    zoom: viewOf('world').z,
    minZoom: 0.5,
    maxZoom: 5.2,
    attributionControl: false,
    renderWorldCopies: false
  });
  } catch (err) {
    fail('Не удалось запустить глобус: в браузере выключено или недоступно WebGL.<br>Включите аппаратное ускорение в настройках браузера и обновите страницу.');
    return;
  }
  map.on('error', function (e) { if (window.console) console.warn('map error', e && e.error); });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'bottom-right');
  map.on('style.load', function () {
    try { map.setProjection({ type: 'globe' }); } catch (e) {}
    try {
      map.setSky({
        'sky-color': '#2a7de1', 'sky-horizon-blend': 0.5,
        'horizon-color': '#9cc9ff', 'horizon-fog-blend': 0.5,
        'fog-color': '#1e3a8a', 'fog-ground-blend': 0.5,
        'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 4, 1, 5.5, 0.4]
      });
    } catch (e) {}
  });

  var STATE = function (name, v) { return ['boolean', ['feature-state', name], false]; };

  map.on('load', function () {
    map.addSource('c', { type: 'geojson', data: D.countries, promoteId: 'id' });
    map.addSource('r', { type: 'geojson', data: D.rivers, promoteId: 'id' });
    map.addSource('d', { type: 'geojson', data: D.dots, promoteId: 'id' });

    map.addLayer({ id: 'fill', type: 'fill', source: 'c', paint: {
      'fill-color': ['case', STATE('ok'), '#3bc48a', STATE('bad'), '#ef5b64', STATE('rev'), '#e5a921', STATE('hover'), '#46689f', '#2b3d58']
    } });
    map.addLayer({ id: 'line', type: 'line', source: 'c', paint: { 'line-color': '#7ea6ee', 'line-width': 0.8, 'line-opacity': 0.9 } });
    map.addLayer({ id: 'rivers', type: 'line', source: 'r', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: {
      'line-color': ['case', STATE('ok'), '#3bc48a', STATE('bad'), '#ef5b64', STATE('rev'), '#e5a921', STATE('hover'), '#b9dcff', '#3d8bff'],
      'line-width': ['case', STATE('ok'), 3.6, STATE('bad'), 3.6, STATE('rev'), 3.8, STATE('hover'), 3, 1.3],
      'line-opacity': ['interpolate', ['linear'], ['zoom'], 1, 0.3, 3, 0.9]
    } });
    map.addLayer({ id: 'rivers-hit', type: 'line', source: 'r', layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#000', 'line-opacity': 0, 'line-width': 14 } });
    map.addLayer({ id: 'dots', type: 'circle', source: 'd', paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 1, 2.6, 4, 6.5],
      'circle-color': ['case', STATE('ok'), '#3bc48a', STATE('bad'), '#ef5b64', STATE('rev'), '#e5a921', STATE('hover'), '#ffffff',
        ['==', ['get', 'k'], 'falls'], '#7fd1ff', '#ffd166'],
      'circle-stroke-width': 1.5, 'circle-stroke-color': '#0b1020'
    } });

    $('loading').style.display = 'none';
    bindEvents();
    loadTests();
  });

  function fs(id, st) {
    var s = kind[id]; if (!s) return;
    map.setFeatureState({ source: s, id: id }, st);
  }

  // ---------------------------------------------------------------- выбор объекта под курсором
  // allow: 'country' — страны и микрогосударства, 'river' — реки и водопады, 'any' — страны и все точки
  // Свой поиск объекта под курсором. queryRenderedFeatures на глобусе даёт неточные результаты,
  // поэтому берём долготу/широту точки и проверяем её по полигонам, линиям и точкам из globe-data.js.
  var CI = D.countries.features.map(function (f) {
    var bb = [1e9, 1e9, -1e9, -1e9];
    f.geometry.coordinates.forEach(function (poly) { poly[0].forEach(function (p) {
      if (p[0] < bb[0]) bb[0] = p[0]; if (p[1] < bb[1]) bb[1] = p[1]; if (p[0] > bb[2]) bb[2] = p[0]; if (p[1] > bb[3]) bb[3] = p[1];
    }); });
    return { id: f.properties.id, a: +f.properties.a || 0, bb: bb, g: f.geometry.coordinates };
  });
  var RI = D.rivers.features.map(function (f) {
    var bb = [1e9, 1e9, -1e9, -1e9];
    f.geometry.coordinates.forEach(function (ln) { ln.forEach(function (p) {
      if (p[0] < bb[0]) bb[0] = p[0]; if (p[1] < bb[1]) bb[1] = p[1]; if (p[0] > bb[2]) bb[2] = p[0]; if (p[1] > bb[3]) bb[3] = p[1];
    }); });
    return { id: f.properties.id, bb: bb, g: f.geometry.coordinates };
  });
  var DI = D.dots.features.map(function (f) { return { id: f.properties.id, k: f.properties.k, p: f.geometry.coordinates }; });

  function pip(ring, x, y) {
    var c = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var a = ring[i], b = ring[j];
      if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
  function inPoly(poly, x, y) {
    if (!pip(poly[0], x, y)) return false;
    for (var h = 1; h < poly.length; h++) if (pip(poly[h], x, y)) return false;
    return true;
  }
  function countryAt(x, y) {
    var best = null;
    for (var i = 0; i < CI.length; i++) {
      var c = CI[i];
      if (x < c.bb[0] || x > c.bb[2] || y < c.bb[1] || y > c.bb[3]) continue;
      for (var k = 0; k < c.g.length; k++) {
        if (inPoly(c.g[k], x, y)) { if (!best || c.a < best.a) best = c; break; }
      }
    }
    return best ? best.id : null;
  }
  function segDist(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy, t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0;
    t = Math.max(0, Math.min(1, t));
    var qx = ax + t * dx - px, qy = ay + t * dy - py;
    return Math.sqrt(qx * qx + qy * qy);
  }
  function riverAt(x, y, tol) {
    var kx = Math.cos(y * Math.PI / 180), best = null, bd = tol;
    for (var i = 0; i < RI.length; i++) {
      var r = RI[i];
      if (x < r.bb[0] - tol / kx || x > r.bb[2] + tol / kx || y < r.bb[1] - tol || y > r.bb[3] + tol) continue;
      for (var l = 0; l < r.g.length; l++) {
        var ln = r.g[l];
        for (var j = 1; j < ln.length; j++) {
          var d = segDist(x * kx, y, ln[j - 1][0] * kx, ln[j - 1][1], ln[j][0] * kx, ln[j][1]);
          if (d < bd) { bd = d; best = r.id; }
        }
      }
    }
    return best;
  }
  function dotAt(x, y, tol, allow) {
    var kx = Math.cos(y * Math.PI / 180), best = null, bd = tol;
    DI.forEach(function (d) {
      if (!(allow === 'any' || (allow === 'river' ? d.k === 'falls' : d.k === 'micro'))) return;
      var dd = Math.hypot((d.p[0] - x) * kx, d.p[1] - y);
      if (dd < bd) { bd = dd; best = d.id; }
    });
    return best;
  }
  function onGlobe(pt, ll) {            // клик по самому шару, а не по космосу вокруг него
    var q = map.project(ll);
    return Math.hypot(q.x - pt.x, q.y - pt.y) < 3;
  }
  // allow: 'country' — страны и микрогосударства, 'river' — реки и водопады, 'any' — страны и все точки
  function pick(e, allow) {
    var ll = e.lngLat || map.unproject(e.point);
    if (!ll || !isFinite(ll.lng) || !isFinite(ll.lat) || !onGlobe(e.point, ll)) return null;
    var tol = 360 / (512 * Math.pow(2, map.getZoom()));     // градусов на пиксель
    var d = dotAt(ll.lng, ll.lat, 10 * tol, allow);
    if (d) return d;
    if (allow === 'river') return riverAt(ll.lng, ll.lat, 7 * tol);
    return countryAt(ll.lng, ll.lat);
  }
  function currentAllow() {
    if (mode === 'quiz' && Q.item) return kind[Q.item.id] === 'r' || dotK[Q.item.id] === 'falls' ? 'river' : 'country';
    return 'any';
  }

  // ---------------------------------------------------------------- подсказки-тосты
  var toastEl = $('toast'), toastTimer;
  function toast(msg, cls, ms) {
    toastEl.textContent = msg;
    toastEl.className = 'on ' + (cls || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ''; }, ms || 1800);
  }

  // ---------------------------------------------------------------- события карты
  var mode = 'explore', hoverId = null, hoverRaf = 0, hoverPt = null;
  function setHover(id) {
    if (id === hoverId) return;
    if (hoverId) fs(hoverId, { hover: false });
    hoverId = id;
    if (hoverId) fs(hoverId, { hover: true });
    map.getCanvas().style.cursor = hoverId ? 'pointer' : '';
  }
  function bindEvents() {
    map.on('mousemove', function (e) {
      if (mode === 'mark') return;
      hoverPt = e;
      if (hoverRaf) return;
      hoverRaf = requestAnimationFrame(function () {
        hoverRaf = 0;
        if (hoverPt) setHover(pick(hoverPt, currentAllow()));
      });
    });
    map.getCanvas().addEventListener('mouseleave', function () { hoverPt = null; setHover(null); });

    map.on('click', function (e) {
      if (mode === 'mark') { addMark(e.lngLat); return; }
      if (mode === 'explore') {
        var id = pick(e, 'any');
        if (id) toast(nameOf[id] + (capName[id] ? ' — столица: ' + capName[id] : ''), '', 2600);
        return;
      }
      if (mode === 'quiz') quizClick(e);
    });
  }

  // ---------------------------------------------------------------- метки
  var markers = [];
  function addMark(lngLat) {
    var el = document.createElement('div');
    el.className = 'mark';
    var m = new maplibregl.Marker({ element: el }).setLngLat(lngLat).addTo(map);
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      m.remove();
      markers = markers.filter(function (x) { return x !== m; });
    });
    markers.push(m);
  }
  $('clear').onclick = function () { markers.forEach(function (m) { m.remove(); }); markers = []; };

  // ---------------------------------------------------------------- тесты
  function loadTests() {
    fetch('tests.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (j) {
        var arr = Array.isArray(j) ? j : (j.tests || []);
        settings = (j && j.settings) || {};
        arr.forEach(function (t) { (t.items || []).forEach(function (it) { if (it.capital) capName[it.id] = it.capital; }); });
        tests = arr.filter(function (t) {
          if (!WORLD_MAPS[t.map] || t.study === true) return false;
          return (t.items || []).some(function (it) { return kind[it.id]; });
        });
      })
      .catch(function () {})
      .then(buildTestSelect);
  }
  function buildTestSelect() {
    var sel = $('test');
    sel.innerHTML = '<option value="">Все страны мира (случайный порядок)</option>';
    var groups = {};
    tests.forEach(function (t, i) {
      var g = t.grade || 'Тесты';
      if (!groups[g]) { groups[g] = document.createElement('optgroup'); groups[g].label = g; sel.appendChild(groups[g]); }
      var o = document.createElement('option'); o.value = String(i); o.textContent = t.title; groups[g].appendChild(o);
    });
    sel.style.display = '';
    sel.onchange = function () {
      updCapUi();
      if (mode === 'quiz') startQuiz(); else flyToTest();
    };
    updCapUi();
  }
  function curTest() { var v = $('test').value; return v === '' ? null : tests[+v]; }
  function updCapUi() {
    var t = curTest();
    $('capwrap').style.display = (mode === 'quiz' && (!t || t.capitals !== false) && !isRiverTest(t)) ? '' : 'none';
  }
  function isRiverTest(t) { return !!t && t.items && t.items.length && kind[t.items[0].id] === 'r'; }
  function flyToTest() {
    var t = curTest(), v = viewOf(t ? t.map : 'world');
    map.flyTo({ center: v.c, zoom: v.z, duration: 1400, essential: true });
  }

  var Q = { items: [], i: -1, item: null, step: 'find', locked: false, okC: 0, totC: 0, okK: 0, totK: 0, shown: [], marks: [], timer: 0 };

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function capsOn() { var t = curTest(); return $('capchk').checked && (!t || t.capitals !== false) && !isRiverTest(t); }

  function startQuiz() {
    clearTimeout(Q.timer);
    clearRound();
    $('result').classList.remove('on');
    var t = curTest(), pool;
    if (t) {
      pool = t.items.filter(function (it) { return kind[it.id]; });
    } else {
      var ids = {};
      tests.forEach(function (x) { if (!isRiverTest(x)) x.items.forEach(function (it) { if (kind[it.id] && kind[it.id] !== 'r' && dotK[it.id] !== 'falls') ids[it.id] = 1; }); });
      var list = Object.keys(ids);
      if (!list.length) list = D.countries.features.map(function (f) { return f.properties.id; }).filter(function (id) { return D.caps[id]; });
      pool = list.map(function (id) { return { id: id, name: nameOf[id], capital: capName[id] || '', hint: '' }; });
    }
    pool = shuffle(pool.slice());
    if (t && t.mode === 'random' && t.count) pool = pool.slice(0, t.count);
    Q.items = pool; Q.i = -1; Q.okC = Q.totC = Q.okK = Q.totK = 0; Q.item = null;
    if (!pool.length) { $('task').innerHTML = 'Нет объектов для теста<small>Выберите другой тест</small>'; return; }
    flyToTest();
    nextQuestion();
  }

  function clearRound() {
    Q.shown.forEach(function (id) { fs(id, { ok: false, bad: false, rev: false }); });
    Q.shown = [];
    Q.marks.forEach(function (m) { m.remove(); });
    Q.marks = [];
  }
  function show(id, st) { fs(id, st); if (Q.shown.indexOf(id) < 0) Q.shown.push(id); }

  function updScore() {
    var n = Q.items.length, done = Math.min(Q.i + 1, n);
    $('score').textContent = done + ' / ' + n + ' · верно ' + (Q.okC + Q.okK);
  }

  function nextQuestion() {
    clearRound();
    Q.i++;
    if (Q.i >= Q.items.length) { finishQuiz(); return; }
    Q.item = Q.items[Q.i]; Q.step = 'find'; Q.locked = false;
    var it = Q.item, what = kind[it.id] === 'r' ? 'Найдите реку' : (dotK[it.id] === 'falls' ? 'Найдите водопад' : 'Найдите');
    $('task').innerHTML = esc(what) + ': <span>' + esc(it.name) + '</span><small>Вопрос ' + (Q.i + 1) + ' из ' + Q.items.length + '</small>';
    $('hintb').style.display = it.hint ? '' : 'none';
    updScore();
  }

  function quizClick(e) {
    if (Q.locked || !Q.item) return;
    if (Q.step === 'find') {
      var id = pick(e, currentAllow());
      if (!id) { toast('Здесь океан — нажмите на объект', 'bad'); return; }
      answerFind(id);
    } else if (Q.step === 'cap') {
      answerCap(e.lngLat);
    }
  }

  function answerFind(id) {
    Q.locked = true; Q.totC++;
    var it = Q.item;
    if (id === it.id) {
      Q.okC++; show(it.id, { ok: true }); toast('Верно!', 'ok');
    } else {
      show(id, { bad: true }); show(it.id, { rev: true });
      toast('Это: ' + (nameOf[id] || '—'), 'bad', 2200);
      var c = D.caps[it.id];
      if (c) map.easeTo({ center: c, duration: 900 });
    }
    updScore();
    Q.timer = setTimeout(afterFind, 1100);
  }
  function afterFind() {
    var it = Q.item;
    if (capsOn() && it.capital && D.caps[it.id]) {
      Q.step = 'cap'; Q.locked = false;
      $('task').innerHTML = 'Отметьте столицу: <span>' + esc(it.capital) + '</span><small>' + esc(it.name) + ' · нажмите на глобусе</small>';
      $('hintb').style.display = 'none';
      map.easeTo({ center: D.caps[it.id], duration: 800 });
    } else {
      nextQuestion();
    }
  }

  function dist(a, b) {
    var R = 6371, r = Math.PI / 180, dLat = (b[1] - a[1]) * r, dLng = (b[0] - a[0]) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function answerCap(ll) {
    Q.locked = true; Q.totK++;
    var it = Q.item, c = D.caps[it.id], d = dist(c, [ll.lng, ll.lat]), ok = d <= 300;
    if (ok) Q.okK++;
    var tel = document.createElement('div'); tel.className = 'cap-truth'; tel.innerHTML = '<i></i><b>' + esc(it.capital) + '</b>';
    Q.marks.push(new maplibregl.Marker({ element: tel }).setLngLat(c).addTo(map));
    var uel = document.createElement('div'); uel.className = 'cap-user ' + (ok ? 'ok' : 'bad');
    Q.marks.push(new maplibregl.Marker({ element: uel }).setLngLat(ll).addTo(map));
    toast((ok ? 'Верно! ' : 'Мимо: ') + Math.round(d) + ' км до столицы', ok ? 'ok' : 'bad', 2200);
    updScore();
    Q.timer = setTimeout(nextQuestion, 2000);
  }

  $('skip').onclick = function () {
    if (!Q.item || Q.locked) return;
    Q.locked = true;
    if (Q.step === 'find') {
      Q.totC++; show(Q.item.id, { rev: true });
      var c = D.caps[Q.item.id]; if (c) map.easeTo({ center: c, duration: 800 });
      toast('Это: ' + Q.item.name, '', 1600);
      Q.timer = setTimeout(afterFind, 1200);
    } else {
      Q.totK++; nextQuestion();
    }
  };
  $('hintb').onclick = function () { if (Q.item && Q.item.hint) toast(Q.item.hint, '', 5000); };
  $('stop').onclick = function () { if (Q.items.length) finishQuiz(true); };

  function finishQuiz(early) {
    clearTimeout(Q.timer);
    clearRound();
    var total = Q.totC + Q.totK, ok = Q.okC + Q.okK, pct = total ? Math.round(ok / total * 100) : 0;
    var sc = settings.scale || { 3: 50, 4: 70, 5: 90 };
    var mark = pct >= sc[5] ? 5 : pct >= sc[4] ? 4 : pct >= sc[3] ? 3 : 2;
    Q.item = null; Q.step = 'find';
    $('task').innerHTML = 'Тест ' + (early ? 'завершён досрочно' : 'пройден') + '<small>Результат ниже</small>';
    $('hintb').style.display = 'none';
    var html = '<h2>' + (early ? 'Тест завершён' : 'Готово!') + '</h2>' +
      '<div class="big">' + ok + ' из ' + total + ' · ' + pct + '%</div>' +
      '<p>Найдено объектов: <b>' + Q.okC + '</b> из ' + Q.totC + '</p>' +
      (Q.totK ? '<p>Столиц отмечено верно: <b>' + Q.okK + '</b> из ' + Q.totK + '</p>' : '') +
      (total ? '<p>Оценка по шкале тренажёра: <b>' + mark + '</b></p>' : '') +
      '<div class="row"><button class="btn pri" id="again">Ещё раз</button><button class="btn" id="closeres">Закрыть</button></div>';
    $('rescard').innerHTML = html;
    $('result').classList.add('on');
    $('again').onclick = startQuiz;
    $('closeres').onclick = function () { $('result').classList.remove('on'); setMode('explore'); };
  }

  // ---------------------------------------------------------------- режимы
  function setMode(m) {
    mode = m;
    clearTimeout(Q.timer);
    Array.prototype.forEach.call($('modes').children, function (b) { b.classList.toggle('on', b.getAttribute('data-m') === m); });
    var q = m === 'quiz';
    $('skip').style.display = q ? '' : 'none';
    $('stop').style.display = q ? '' : 'none';
    $('score').style.display = q ? '' : 'none';
    $('clear').style.display = m === 'mark' ? '' : 'none';
    $('result').classList.remove('on');
    updCapUi();
    setHover(null);
    if (q) {
      startQuiz();
    } else {
      clearRound(); Q.item = null;
      $('hintb').style.display = 'none';
      $('task').innerHTML = m === 'mark'
        ? 'Метки<small>Нажмите на глобус, чтобы поставить метку; нажмите на метку, чтобы убрать</small>'
        : 'Глобус<small>Вращайте, приближайте, нажимайте на страны</small>';
    }
  }
  $('modes').addEventListener('click', function (e) {
    var m = e.target.getAttribute && e.target.getAttribute('data-m');
    if (m) setMode(m);
  });

  // ================================================================ КОСМОС
  var space = $('space'), cv = $('stars'), cx = cv.getContext('2d');
  var bodies = Array.prototype.slice.call(space.querySelectorAll('.body'));
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, dpr = 1, ulng = 0, lastLng = null, lat = 0, spaceOn = true;
  var TINT = ['#ffffff', '#ffffff', '#cfe0ff', '#bcd2ff', '#fff1cf', '#ffd9d0'];
  var stars = [];
  for (var s = 0; s < 560; s++) {
    var big = Math.random() < 0.06;
    stars.push({
      x: Math.random(), y: Math.random(),
      r: big ? 1.2 + Math.random() * 0.9 : 0.35 + Math.random() * 0.75,
      d: 0.12 + Math.random() * 0.88, p: Math.random() * 6.283, sp: 0.6 + Math.random() * 2.2,
      c: TINT[Math.floor(Math.random() * TINT.length)], big: big
    });
  }
  var meteor = null, nextMeteor = 4000 + Math.random() * 6000;

  function resize() {
    var r = space.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function updPlanets() {
    var sl = Math.sin(ulng * Math.PI / 180), sa = Math.sin(lat * Math.PI / 180);
    bodies.forEach(function (b) {
      var d = +b.getAttribute('data-d');
      b.style.setProperty('--dx', (sl * 90 * d).toFixed(1) + 'px');
      b.style.setProperty('--dy', (-sa * 60 * d).toFixed(1) + 'px');
    });
  }
  map.on('move', function () {
    var c = map.getCenter(), dl = c.lng - (lastLng === null ? c.lng : lastLng);
    if (dl > 180) dl -= 360; if (dl < -180) dl += 360;
    ulng += dl; lastLng = c.lng; lat = c.lat;
    updPlanets();
  });

  var last = 0, acc = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (!spaceOn || document.hidden) return;
    var dt = t - last; last = t; acc += dt;
    if (acc < 30) return;           // ~30 к/с — звёздам этого достаточно
    var step = acc; acc = 0;
    cx.clearRect(0, 0, W, H);
    var kx = W / 360 * 1.6, ky = H / 180 * 0.9;
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var x = (((st.x * W - ulng * kx * st.d) % W) + W) % W;
      var y = (((st.y * H + lat * ky * st.d) % H) + H) % H;
      var a = reduce ? 0.8 : 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.001 * st.sp + st.p));
      cx.globalAlpha = a * (0.45 + 0.55 * st.d);
      cx.fillStyle = st.c;
      if (st.big) {
        var g = cx.createRadialGradient(x, y, 0, x, y, st.r * 4);
        g.addColorStop(0, st.c); g.addColorStop(1, 'rgba(255,255,255,0)');
        cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, st.r * 4, 0, 6.283); cx.fill();
        cx.fillStyle = '#fff';
      }
      cx.beginPath(); cx.arc(x, y, st.r, 0, 6.283); cx.fill();
    }
    cx.globalAlpha = 1;
    if (!reduce) {
      nextMeteor -= step;
      if (!meteor && nextMeteor <= 0) {
        var ang = (20 + Math.random() * 25) * Math.PI / 180;
        meteor = { x: Math.random() * W * 0.8, y: Math.random() * H * 0.45, vx: Math.cos(ang), vy: Math.sin(ang), life: 0, len: 90 + Math.random() * 90 };
        nextMeteor = 7000 + Math.random() * 12000;
      }
      if (meteor) {
        meteor.life += step; var p = meteor.life / 900;
        if (p >= 1) { meteor = null; }
        else {
          var hx = meteor.x + meteor.vx * p * W * 0.35, hy = meteor.y + meteor.vy * p * W * 0.35;
          var tx = hx - meteor.vx * meteor.len, ty = hy - meteor.vy * meteor.len;
          var lg = cx.createLinearGradient(hx, hy, tx, ty);
          lg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * (1 - p)) + ')'); lg.addColorStop(1, 'rgba(255,255,255,0)');
          cx.strokeStyle = lg; cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(hx, hy); cx.lineTo(tx, ty); cx.stroke();
        }
      }
    }
  }
  requestAnimationFrame(frame);

  function applySpace() {
    spaceOn = $('spacechk').checked;
    space.classList.toggle('off', !spaceOn);
    try { localStorage.setItem('gt_globe_space', spaceOn ? '1' : '0'); } catch (e) {}
  }
  try { if (localStorage.getItem('gt_globe_space') === '0') $('spacechk').checked = false; } catch (e) {}
  $('spacechk').onchange = applySpace;
  applySpace();
  updPlanets();
})();
</script>
</body>
</html>
