<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Геотренажёр — nmchv.ru</title>
<meta name="description" content="Интерактивный тренажёр по географии для 7–9 классов: страны мира, физическая география России, субъекты и федеральные округа, столицы и административные центры.">
<meta name="theme-color" content="#08090b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b8def' stroke-width='1.6'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cellipse cx='12' cy='12' rx='4' ry='9'/%3E%3Cpath d='M3 12h18'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope@5/index.css">

<style>
/* ============================================================
   Геотренажёр — оформление в стилистике nmchv.ru
   (тёмная тема, акцент #5b8def, шрифт Manrope)
   ============================================================ */
:root {
  --color-background: #08090b;
  --color-surface: #111318;
  --color-surface-elevated: #191d24;
  --color-text-primary: #f2f4f7;
  --color-text-secondary: #969eab;
  --color-accent: #5b8def;
  --color-accent-hover: #a5c4ff;
  --color-border: #292e38;
  --color-ok: #3bc48a;
  --color-bad: #ef5b64;
  --color-warn: #e5a921;

  --font-sans: 'Manrope Variable', 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  --radius: 6px;
  --gutter: clamp(20px, 5vw, 56px);
  --max: 1200px;
  --header-h: 60px;

  --fs-body: clamp(1rem, 0.96rem + 0.2vw, 1.125rem);
  --fs-small: 0.875rem;
  --fs-h2: clamp(1.6rem, 1.2rem + 1.6vw, 2.5rem);
  --fs-h1: clamp(2.4rem, 1.2rem + 5.2vw, 4.9rem);

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);

  /* карта: тёмная тема по умолчанию */
  --sea: #090c12; --sea2: #10161f;
  --land: #222b3a; --ctx: #131820; --hover: #33476f;
  --bord: #4f7fd6; --ctxb: #232b37; --grat: #ffffff0d;
  --lab: #f2f4f7; --labs: #08090b;
  --ok: var(--color-ok); --bad: var(--color-bad);
  --panel: var(--color-surface-elevated); --line: var(--color-border); --ink: var(--color-text-primary); --mute: var(--color-text-secondary);
  --acc: var(--color-accent); --accink: #06080c; --sea-chip: #1a2a47;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); -webkit-text-size-adjust: 100%; color-scheme: dark; background: var(--color-background); }
body {
  margin: 0; background: var(--color-background); color: var(--color-text-primary);
  font-family: var(--font-sans); font-size: var(--fs-body); line-height: 1.6;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--color-accent-hover); outline-offset: 3px; border-radius: 2px; }
::selection { background: rgb(91 141 239 / .35); }

.container { width: 100%; max-width: calc(var(--max) + var(--gutter) * 2); margin-inline: auto; padding-inline: var(--gutter); }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: fixed; top: 8px; left: 8px; z-index: 100; padding: 10px 14px; background: var(--color-surface-elevated); border: 1px solid var(--color-accent); border-radius: var(--radius); transform: translateY(-200%); }
.skip-link:focus { transform: none; }

/* ---------- Шапка ---------- */
.site-header { position: sticky; top: 0; z-index: 50; height: var(--header-h); background: rgb(8 9 11 / .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid transparent; transition: border-color .3s var(--ease); }
.site-header.is-scrolled { border-color: var(--color-border); }
.site-header .container { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; letter-spacing: .01em; font-size: .95rem; min-height: 44px; background: none; border: 0; padding: 0; }
.brand-mark { width: 24px; height: 24px; color: var(--color-accent); }
.brand-name { white-space: nowrap; }
.header-actions { display: flex; align-items: center; gap: clamp(12px, 2.5vw, 32px); }
.nav { display: flex; gap: clamp(14px, 3vw, 32px); }
.nav a, .nav button {
  position: relative; display: inline-flex; align-items: center; min-height: 44px; padding: 0; background: none; border: 0;
  font-size: var(--fs-small); color: var(--color-text-secondary); transition: color .25s var(--ease);
}
.nav a::after, .nav button::after { content: ''; position: absolute; left: 0; right: 0; bottom: 8px; height: 1px; background: var(--color-accent); transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease); }
.nav a:hover, .nav button:hover { color: var(--color-text-primary); }
.nav a:hover::after, .nav button:hover::after { transform: scaleX(1); }
@media (max-width: 640px) { .brand-name { display: none; } .nav { gap: 16px; } }
.nav a, .nav button { white-space: nowrap; }
@media (max-width: 480px) { .nav [data-nav=sec-style] { display: none; } }

/* ---------- Кнопки ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 44px; padding: 0 20px;
  background: var(--color-accent); color: var(--accink); border: 0; border-radius: var(--radius);
  font-weight: 600; font-size: .95rem; line-height: 1.2;
  transition: background-color .25s var(--ease), transform .35s var(--ease), box-shadow .35s var(--ease), border-color .25s var(--ease), color .25s var(--ease);
}
.btn svg { width: 16px; height: 16px; transition: transform .25s var(--ease); }
.btn:hover { background: var(--color-accent-hover); transform: translateY(-2px); box-shadow: 0 10px 28px rgb(91 141 239 / .2); }
.btn:hover svg { transform: translateY(3px); }
.btn.ghost { background: transparent; color: var(--color-text-primary); border: 1px solid var(--color-border); }
.btn.ghost:hover { border-color: var(--color-accent); color: var(--color-accent-hover); background: var(--color-surface-elevated); box-shadow: none; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: .875rem; }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
.lnk { background: none; border: 0; color: var(--color-text-secondary); text-decoration: underline; text-underline-offset: 3px; padding: 0; transition: color .2s var(--ease); }
.lnk:hover { color: var(--color-accent-hover); }

/* ---------- Поля ---------- */
input[type=text], input[type=search], input[type=password], input[type=number], select, textarea {
  padding: 10px 12px; border: 1px solid var(--color-border); border-radius: var(--radius);
  background: var(--color-surface); color: var(--color-text-primary); width: 100%; min-height: 42px;
  transition: border-color .2s var(--ease), background .2s var(--ease);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--color-accent); background: var(--color-surface-elevated); }
input::placeholder, textarea::placeholder { color: #6b7380; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--color-accent); }
input[type=number] { width: auto; }
select option { background: var(--color-surface-elevated); }

/* ---------- Первый экран ---------- */
.hero { position: relative; padding-block: clamp(44px, 9vh, 96px) clamp(36px, 6vh, 64px); overflow: hidden; }
.hero::before {
  content: ''; position: absolute; z-index: 0; top: 50%; right: -14%; width: clamp(420px, 68vw, 860px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, rgb(59 104 190 / .15), rgb(59 104 190 / .045) 38%, transparent 70%); pointer-events: none; transform: translateY(-50%);
}
.hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); align-items: center; gap: clamp(24px, 5vw, 72px); }
.eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: var(--fs-small); letter-spacing: .14em; text-transform: uppercase; color: var(--color-text-secondary); }
.eyebrow::before { content: ''; width: 32px; height: 1px; background: var(--color-accent); }
.hero h1 { margin-top: 26px; font-size: var(--fs-h1); font-weight: 600; line-height: 1.02; letter-spacing: -.035em; text-wrap: balance; }
.hero h1 .accent { color: var(--color-text-secondary); font-weight: 500; display: block; }
.signature { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 6px 0; font-size: var(--fs-small); color: var(--color-accent-hover); letter-spacing: .02em; }
.signature li + li::before { content: '·'; margin-inline: 12px; color: var(--color-text-secondary); }
.lead { margin-top: 22px; max-width: 34em; font-size: clamp(1.02rem, 1rem + .35vw, 1.25rem); color: var(--color-text-secondary); text-wrap: pretty; }
@media (max-width: 520px) { .signature { flex-direction: column; } .signature li + li::before { content: none; } }
.settings { margin-top: 34px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.settings-label { font-size: var(--fs-small); letter-spacing: .14em; text-transform: uppercase; color: var(--color-text-secondary); }
.hero-actions { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px; }
.hero-art { position: relative; justify-self: end; width: 100%; max-width: 420px; color: var(--color-border); }
.hero-art svg { width: 100%; height: auto; overflow: visible; }
.js .hero-art svg { animation: art-float 8s ease-in-out 1.2s infinite; }
.hero-art .g-line { stroke: currentColor; fill: none; stroke-width: 1; vector-effect: non-scaling-stroke; }
.hero-art .g-accent { stroke: var(--color-accent); fill: none; stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.hero-art .g-dot { fill: var(--color-accent); }
.hero-art .g-dot-ring { fill: none; stroke: var(--color-accent-hover); stroke-width: 1; vector-effect: non-scaling-stroke; }
.js .hero-art .g-dot-ring { transform-box: fill-box; transform-origin: center; animation: marker-pulse 3s ease-out 1.2s infinite; }
.hero-art text { font-family: var(--font-sans); font-size: 10px; letter-spacing: .12em; fill: var(--color-text-secondary); }
.coords { margin-top: 12px; font-size: .75rem; letter-spacing: .12em; color: var(--color-text-secondary); text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 860px) {
  .hero { padding-top: 40px; }
  .hero-grid { grid-template-columns: 1fr; }
  .hero-art { order: -1; justify-self: start; max-width: 190px; }
  .coords { text-align: left; }
}

/* ---------- Разделы ---------- */
.section { padding-block: clamp(52px, 9vw, 104px); border-top: 1px solid var(--color-border); }
.section-head { margin-bottom: clamp(28px, 4.5vw, 48px); max-width: 42em; }
.section-head h2 { font-size: var(--fs-h2); font-weight: 600; line-height: 1.1; letter-spacing: -.025em; }
.section-head p { margin-top: 14px; color: var(--color-text-secondary); text-wrap: pretty; }
.section-index { display: block; margin-bottom: 16px; font-size: var(--fs-small); letter-spacing: .14em; color: var(--color-accent); font-variant-numeric: tabular-nums; }
.sub-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; margin: clamp(28px, 4vw, 44px) 0 14px; }
.sub-head:first-of-type { margin-top: 0; }
.sub-head h3 { font-size: clamp(1.15rem, 1.05rem + .6vw, 1.5rem); font-weight: 600; letter-spacing: -.015em; }
.sub-head span { color: var(--color-text-secondary); font-size: var(--fs-small); }

/* фильтры-«таблетки» */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: clamp(22px, 3.5vw, 34px); }
.chip {
  display: inline-flex; min-height: 42px; align-items: center; gap: 10px; padding: 0 16px;
  border: 1px solid var(--color-border); border-radius: 999px; background: transparent; color: var(--color-text-secondary);
  font-size: var(--fs-small); transition: border-color .25s var(--ease), background .25s var(--ease), color .25s var(--ease);
}
.chip:hover, .chip.on { border-color: var(--color-accent); background: var(--color-surface-elevated); color: var(--color-accent-hover); }
.chip small { font-size: .78em; font-variant-numeric: tabular-nums; opacity: .8; }
.sw { width: 30px; height: 16px; border-radius: 4px; border: 1px solid #ffffff22; flex: none; }

/* список тестов — строки, как «Проекты» на основном сайте */
.rows { border-top: 1px solid var(--color-border); counter-reset: rows; }
.row-item {
  position: relative; overflow: hidden; width: 100%; counter-increment: rows; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--color-border); color: inherit;
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px clamp(14px, 3vw, 32px);
  padding-block: clamp(18px, 2.6vw, 26px);
  transition: padding-left .3s var(--ease), border-color .3s var(--ease), background .35s var(--ease);
}
.row-item::before { content: counter(rows, decimal-leading-zero); font-size: var(--fs-small); color: var(--color-accent); letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.row-item::after { content: ''; position: absolute; inset: auto auto 0 0; width: 42%; height: 1px; background: linear-gradient(90deg, var(--color-accent), transparent); transform: scaleX(0); transform-origin: left; transition: transform .55s var(--ease); }
.row-title { display: block; font-size: clamp(1.05rem, .98rem + .5vw, 1.4rem); font-weight: 500; letter-spacing: -.012em; line-height: 1.3; transition: color .3s var(--ease), transform .35s var(--ease); }
.row-meta { display: block; margin-top: 4px; font-size: var(--fs-small); color: var(--color-text-secondary); }
.row-end { display: inline-flex; align-items: center; gap: 14px; color: var(--color-text-secondary); font-size: var(--fs-small); white-space: nowrap; }
.row-end svg { width: 16px; height: 16px; color: var(--color-accent); transition: transform .25s var(--ease); }
.tag { border: 1px solid var(--color-border); border-radius: 999px; padding: 2px 12px; font-size: .8rem; color: var(--color-text-secondary); }
@media (hover: hover) {
  .row-item:hover { padding-left: 8px; border-color: rgb(91 141 239 / .45); background: linear-gradient(90deg, transparent, rgb(91 141 239 / .035) 55%, transparent); }
  .row-item:hover .row-title { color: var(--color-accent-hover); transform: translateX(5px); }
  .row-item:hover::after { transform: scaleX(1); }
  .row-item:hover .row-end svg { transform: translateX(4px); }
}
@media (max-width: 560px) {
  .row-item { grid-template-columns: 28px minmax(0, 1fr); }
  .row-end { grid-column: 2; }
}
.empty { color: var(--color-text-secondary); padding-block: 20px; }
.themes { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Подвал ---------- */
.site-footer { border-top: 1px solid var(--color-border); padding-block: 36px; color: var(--color-text-secondary); font-size: var(--fs-small); }
.site-footer .container { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 32px; }
.site-footer button { display: inline-flex; align-items: center; min-height: 44px; background: none; border: 0; padding: 0; color: inherit; font-size: inherit; transition: color .25s var(--ease); }
.site-footer button:hover { color: var(--color-text-primary); }
.footer-nav { display: flex; flex-wrap: wrap; gap: 4px 24px; }
.footer-nav a, .footer-nav button { display: inline-flex; align-items: center; min-height: 44px; background: none; border: 0; padding: 0; color: inherit; font-size: inherit; transition: color .25s var(--ease); }
.footer-nav a:hover, .footer-nav button:hover { color: var(--color-text-primary); }

/* ---------- Страницы (результат, администратор) ---------- */
.page { width: 100%; max-width: calc(940px + var(--gutter) * 2); margin: 0 auto; padding: clamp(40px, 7vw, 84px) var(--gutter) clamp(56px, 9vw, 110px); }
.page h1 { font-size: clamp(2rem, 1.2rem + 3.6vw, 3.6rem); font-weight: 600; line-height: 1.05; letter-spacing: -.03em; margin-bottom: 10px; }
.page h2 { font-size: clamp(1.3rem, 1.1rem + .9vw, 1.8rem); font-weight: 600; letter-spacing: -.02em; margin: clamp(30px, 5vw, 48px) 0 12px; }
.sub, .stat { color: var(--color-text-secondary); }
.sub { margin: 0 0 18px; }
#home { display: block; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
.row > * { flex: 0 0 auto; }
.row .grow { flex: 1 1 220px; }
label { cursor: pointer; }
.row label, label.row { display: inline-flex; align-items: center; gap: 8px; }
table { width: 100%; border-collapse: collapse; margin: 14px 0; }
th, td { padding: 10px 10px; border-bottom: 1px solid var(--color-border); text-align: left; vertical-align: middle; }
th { color: var(--color-text-secondary); font-size: .78rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.okc { color: var(--color-ok); font-weight: 600; }
.badc { color: var(--color-bad); font-weight: 600; }
.score { font-size: clamp(2.4rem, 2rem + 2vw, 3.4rem); font-weight: 700; letter-spacing: -.03em; margin: 4px 0; }
.gr { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; margin: 12px 0 8px; }
.gr .mark { font-size: 64px; font-weight: 800; line-height: 1; width: 96px; height: 96px; border-radius: 16px; display: grid; place-items: center; color: #06080c; }
.m5 { background: var(--color-ok); } .m4 { background: #8ccf5e; } .m3 { background: var(--color-warn); } .m2 { background: var(--color-bad); color: #fff !important; }
.scale { width: auto; min-width: 280px; margin: 8px 0 16px; }
.scale tr.me { background: rgb(91 141 239 / .12); font-weight: 700; color: var(--color-accent-hover); }
.adm-t { max-height: 56vh; overflow: auto; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); }
.adm-t table { margin: 0; min-width: 760px; }
.adm-t th { position: sticky; top: 0; background: var(--color-surface-elevated); z-index: 1; }
.adm-t input[type=text] { padding: 6px 8px; min-height: 34px; }

/* ---------- Игра / изучение ---------- */
html.play, html.play body { height: 100%; overflow: hidden; }
html.play .site-header, html.play .site-footer { display: none; }
#game { display: none; height: 100%; flex-direction: column; background: var(--color-background); }
.top { display: flex; align-items: center; gap: 10px; padding: 10px clamp(12px, 2vw, 20px); padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: var(--color-surface); border-bottom: 1px solid var(--color-border); flex-wrap: wrap; }
.top .back { display: inline-flex; align-items: center; gap: 8px; color: var(--color-text-secondary); }
#task { font-size: clamp(1.05rem, .95rem + .6vw, 1.35rem); font-weight: 700; letter-spacing: -.01em; flex: 1; min-width: 200px; line-height: 1.3; }
#task > span { color: var(--color-accent-hover); }
#task small { display: block; font-size: .8rem; font-weight: 400; color: var(--color-text-secondary); letter-spacing: 0; }
#prog { font-variant-numeric: tabular-nums; font-size: var(--fs-small); border: 1px solid var(--color-border); border-radius: 999px; padding: 4px 14px; }
#stctl { display: none; gap: 14px; align-items: center; flex-wrap: wrap; font-size: var(--fs-small); }
#stctl label { display: flex; gap: 6px; align-items: center; color: var(--color-text-secondary); }
#mapwrap { position: relative; flex: 1; min-height: 0; background: radial-gradient(circle at 50% 40%, var(--sea2), var(--sea)); touch-action: none; }
svg#svg { width: 100%; height: 100%; display: block; cursor: grab; }
svg.drag { cursor: grabbing !important; }
.grat { fill: none; stroke: var(--grat); stroke-width: .6; vector-effect: non-scaling-stroke; pointer-events: none; }
.c { fill: var(--land); stroke: var(--bord); stroke-width: 1; stroke-linejoin: round; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .12s; }
.c:hover { fill: var(--hover); }
.c.x { fill: var(--ctx); stroke: var(--ctxb); stroke-width: .6; }
.c.x:hover { fill: var(--ctx); }
.d { stroke: var(--bord); stroke-width: 1.4; }
.c.ok { fill: var(--ok) !important; }
.c.bad { fill: var(--bad) !important; }
.c.reveal { fill: #e5a921 !important; }
.lab { font-size: var(--fs, 11px); font-weight: 600; fill: var(--lab); paint-order: stroke; stroke: var(--labs, var(--panel)); stroke-width: calc(var(--fs, 11px) * .3); text-anchor: middle; pointer-events: none; font-family: var(--font-sans); }
.lab.cap { text-anchor: start; font-style: italic; font-weight: 500; }
.capdot { fill: #f2f4f7; stroke: #08090b; stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.c.sel { fill: #ffe08a !important; stroke-width: 2.2; }
.c.d { fill: #ffd166; stroke: #222; stroke-width: 1.6; }
.c.d:hover { fill: #fff; }
.c.d.x { display: none; }
#info, #cap, #slist, #toast { background: var(--color-surface-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary); }
#info { display: none; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); border-radius: 10px; padding: 12px 18px; min-width: 240px; width: min(460px, 92%); box-shadow: 0 18px 48px rgb(0 0 0 / .45); z-index: 4; }

.sl-row:hover { background: rgb(91 141 239 / .14); }

#cap { display: none; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); border-radius: 12px; padding: 16px; width: min(580px, 94%); box-shadow: 0 18px 48px rgb(0 0 0 / .45); z-index: 4; }

async function rpc(fn,args){
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
 try{const r=await fetch(BASE+'/rest/v1/rpc/'+fn,{method:'POST',signal:ctl.signal,headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const t=await r.text();if(!r.ok){let m=t;try{m=JSON.parse(t).message||t}catch(_){}throw new Error(m)}return t?JSON.parse(t):null}
 finally{clearTimeout(to)}}
function loadStore(){try{const s=localStorage.getItem(SKEY);if(s){const j=JSON.parse(s);if(j&&j.users)STORE=j}}catch(e){if(_mem)STORE=_mem}
 try{const k=localStorage.getItem(CKEY);if(k){if(!STORE.users[k])STORE.users[k]={name:k,attempts:[]};USER=STORE.users[k];USER.key=k}}catch(e){}}
function saveStore(){_mem=STORE;try{localStorage.setItem(SKEY,JSON.stringify(STORE))}catch(e){}}
const clean=a=>{const o={...a};delete o.pend;return o};
async function pushPending(){if(!REMOTE||!USER)return true;let ok=true;
 for(const a of USER.attempts.filter(x=>x.pend)){try{await rpc('gt_add_attempt',{p_key:USER.key,p_name:USER.name,p_a:clean(a)});delete a.pend}catch(e){ok=false;break}}

async function syncUser(){if(!REMOTE||!USER){return false}
 try{if(!USER.migrated){USER.attempts.forEach(a=>{a.pend=true});USER.migrated=1}   // то, что накоплено до подключения сервера, отправим туда
  await rpc('gt_login',{p_key:USER.key,p_name:USER.name});await pushPending();
  const srv=await rpc('gt_my_attempts',{p_key:USER.key}),pend=USER.attempts.filter(x=>x.pend),seen=new Set(srv.map(x=>x.ts+x.id));
  USER.attempts=[...srv,...pend.filter(x=>!seen.has(x.ts+x.id))].sort((a,b)=>a.ts-b.ts);saveStore();SYNC='ok';return true}
 catch(e){SYNC='err';return false}}
